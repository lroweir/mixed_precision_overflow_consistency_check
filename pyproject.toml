[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "lroweir-mixed_precision_overflow_consistency_check"
version = "0.1.0"
description = "在同一个输入里两两比对，检测实时数仓架构师·混合精度的溢出与下溢相关的矛盾表述，把冲突双方原样并排呈现"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "lroweir" }]
keywords = ["cli", "analysis", "observability", "evaluation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://lroweir.github.io"
Repository = "https://github.com/lroweir/mixed_precision_overflow_consistency_check"
Issues = "https://github.com/lroweir/mixed_precision_overflow_consistency_check/issues"

[project.scripts]
mixed_precision_overflow_consistency_check = "mixed_precision_overflow_consistency_check:main"

[tool.setuptools]
py-modules = ["mixed_precision_overflow_consistency_check"]
